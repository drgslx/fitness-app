# Copy to gke-values.local.yaml and replace EVERY placeholder before deploying.
api:
  image:
    repository: europe-west1-docker.pkg.dev/YOUR_PROJECT/sport-platform/api
    tag: "0.3.0"
  replicas: 1
frontend:
  image:
    repository: europe-west1-docker.pkg.dev/YOUR_PROJECT/sport-platform/frontend
    tag: "0.3.0"
  replicas: 1
firebase:
  projectId: YOUR_PROJECT
serviceAccount:
  gcpEmail: sport-api@YOUR_PROJECT.iam.gserviceaccount.com
storage:
  backend: gcs
  bucket: YOUR_PROJECT-sport-images
ingress:
  enabled: true
  host: sport.YOUR_DOMAIN
  certificateName: sport-cert
  staticIpName: sport-web-ip
