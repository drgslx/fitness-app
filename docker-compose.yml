services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportdb}
      POSTGRES_USER: ${POSTGRES_USER:-sport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sport-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sport} -d ${POSTGRES_DB:-sportdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sport}:${POSTGRES_PASSWORD:-sport-local-password}@postgres:5432/${POSTGRES_DB:-sportdb}
      UPLOAD_DIR: /data/uploads
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
    volumes:
      - uploads:/data/uploads
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: sport-platform-frontend:tailwind
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  postgres_data:
  uploads:
