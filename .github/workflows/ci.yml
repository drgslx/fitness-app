name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sport
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sport_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sport -d sport_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sport:ci-only-password@localhost:5432/sport_test
      TEST_DATABASE_URL: postgresql+psycopg://sport:ci-only-password@localhost:5432/sport_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest tests -q
      - name: Check reversible tracking migration on disposable CI database
        run: |
          alembic downgrade 0001_articles
          alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.11.4"}
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform/bootstrap init -backend=false -input=false
      - run: terraform -chdir=terraform/bootstrap validate
      - uses: azure/setup-helm@v4.3.0
        with: {version: "v3.17.3"}
      - run: |
          helm lint helm/local-db
          helm lint helm/sport-platform
          helm template sport helm/sport-platform > /tmp/local.yaml
          helm template sport helm/sport-platform --set storage.backend=gcs --set ingress.enabled=true --set ingress.host=sport.example.com --set ingress.certificateName=sport-cert --set ingress.staticIpName=sport-web-ip > /tmp/gke.yaml
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t sport-api:ci backend
      - run: docker build -t sport-frontend:ci frontend
